# AMI-CPSD v2.0 Large Grid Configuration (IEEE Journal Paper Baseline)
dataset_version: "AMI-CPSD v2.0"
profile_name: "large_grid"
chunk_size: 100000

# Row Sizes
splits:
  train_rows: 700000
  val_rows: 150000
  test_rows: 150000
  zero_day_rows: 100000

# Random Seeds
seeds:
  train_seed: 42
  val_seed: 43
  test_seed: 44
  zero_day_seed: 45

# Smart Grid Hierarchy
topology:
  num_substations: 2
  num_feeders: 6
  num_transformers: 20
  num_meters: 100
  num_nans: 10
  num_dcs: 4
  num_validator_groups: 8

# Simulation Settings
simulation:
  missing_data_pct: 0.015
  nominal_voltage: 229.0
  voltage_std: 2.0
  nominal_frequency: 50.0
  frequency_std: 0.05
  physics_tolerance_kw: 0.05
